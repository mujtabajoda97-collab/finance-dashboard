name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Optional fingerprint / screen-lock sign-in. Non-fatal: if the plugin cannot be installed
      # the APK is still built and the app simply hides the biometric option.
      - name: Install biometric plugin (optional)
        run: npm install --no-save --no-audit --no-fund capacitor-native-biometric@4 || echo "biometric plugin not installed; continuing without it"

      - name: Create the Android project (first run only)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # Voice alarms: bundled alarm tone (res/raw/alarm.wav, used by the "lifeos-alarm" notification channel)
      # and the permissions Android 12-14 needs for notifications and exact alarms. Idempotent.
      - name: Install alarm tone and alarm permissions
        run: |
          mkdir -p android/app/src/main/res/raw
          cp android-res/raw/alarm.wav android/app/src/main/res/raw/alarm.wav
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for perm in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM VIBRATE WAKE_LOCK RECEIVE_BOOT_COMPLETED USE_BIOMETRIC USE_FINGERPRINT; do
            if ! grep -q "android.permission.$perm\"" "$MANIFEST"; then
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$perm\" />\n</manifest>#" "$MANIFEST"
            fi
          done
          grep -n "uses-permission" "$MANIFEST"
          ls -la android/app/src/main/res/raw

      - name: Sync Capacitor config into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload APK as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Fixed tag "latest" => stable link:
      # https://github.com/<owner>/<repo>/releases/download/latest/app-debug.apk
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Android APK (debug) - build #${{ github.run_number }}" \
            --notes "Debug APK built from commit $GITHUB_SHA. Installs the My Life OS shell that loads the live site."
